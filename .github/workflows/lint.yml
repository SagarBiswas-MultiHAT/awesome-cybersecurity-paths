name: Markdown & Link Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 00:00 UTC to catch stale external URLs
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check External Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --timeout 15 --max-retries 2 'readme.md' 'TRACKER.md' '.github/SECURITY.md' 'CODE_OF_CONDUCT.md' '.github/CONTRIBUTING.md' 'chapters/*.md'
          fail: false
